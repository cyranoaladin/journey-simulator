<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <title>MFAI E2E Smoke</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
    }

    pre {
      background: #f5f5f5;
      padding: 8px;
      border: 1px solid #ddd;
    }
  </style>
</head>

<body>
  <h1>MFAI Orchestration Smoke</h1>
  <label>Input</label>
  <textarea id="input">security.audit</textarea>
  <button id="run">Run</button>
  <h2>Executive Summary</h2>
  <pre id="exec"></pre>
  <h2>Human Plan</h2>
  <pre id="plan"></pre>
  <h3>Agents</h3>
  <pre id="agents"></pre>
  <h3>Ops / systemStatus (debug)</h3>
  <pre id="debug"></pre>

  <script>
    const btn = document.getElementById('run');
    btn.onclick = async () => {
      const intent = document.getElementById('input').value || 'security.audit';
      const payload = { traceId: 'ui-e2e', runId: 'ui-e2e', intent, input: 'ui smoke' };
      const res = await fetch('/orchestration/vslice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      document.getElementById('exec').textContent = JSON.stringify(data.executiveSummary, null, 2);
      document.getElementById('plan').textContent = JSON.stringify(data.humanPlan, null, 2);
      document.getElementById('agents').textContent = JSON.stringify(data.agents || [], null, 2);
      document.getElementById('debug').textContent = JSON.stringify({ ops: data.ops, systemStatus: data.systemStatus }, null, 2);
    };
  </script>
</body>

</html>
