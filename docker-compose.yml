services:
  api:
    build:
      context: ./mf-back
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    command: npm run dev
    env_file:
      - ./mf-back/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://mfai:mfai_secure_2024@postgres:5432/mfai_db?schema=public
    ports:
      - "3002:3000"
    volumes:
      - ./mf-back:/usr/src/app
      - api-node-modules:/usr/src/app/node_modules
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /home/nodeapp/.npm:uid=101,gid=101
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: mfai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mfai_db
      POSTGRES_USER: mfai
      POSTGRES_PASSWORD: mfai_secure_2024
    ports:
      - "5433:5432"
    volumes:
      - mfai_postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "mfai", "-d", "mfai_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  journey-web:
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3002
      API_UPSTREAM: api:3000
    ports:
      - "3003:80"
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      - api

volumes:
  api-node-modules:
  web-node-modules:
  mfai_postgres_data:
