version: "3.9"

services:
  api:
    build:
      context: ./mf-back
      dockerfile: Dockerfile
    command: npm start
    env_file: .env
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./mf-back:/usr/src/app
      - api-node-modules:/usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  journey-web:
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  api-node-modules:
