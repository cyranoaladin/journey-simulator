version: "3.9"

services:
  api:
    build:
      context: ./mf-back
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    command: npm run dev
    env_file:
      - ./mf-back/env.development.example
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3002:3000"
    volumes:
      - ./mf-back:/usr/src/app
      - api-node-modules:/usr/src/app/node_modules
    security_opt:
      - no-new-privileges:true
    # Dev bind mount requires writable filesystem for live reload. // nosemgrep
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    security_opt:
      - no-new-privileges:true
    # Mongo needs writable data dir. // nosemgrep
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "5435:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    # Postgres needs writable data dir. // nosemgrep
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "prisma" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  journey-web:
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3002
      API_UPSTREAM: api:3000
    ports:
      - "3003:80"
    security_opt:
      - no-new-privileges:true
    read_only: true
    depends_on:
      - api

volumes:
  api-node-modules:
  web-node-modules:
