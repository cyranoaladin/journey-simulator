version: "3.9"

services:
  api:
    build:
      context: ./mf-back
      dockerfile: Dockerfile
    # OPTIMISATION: Utilisation de 'npm start' (node direct) au lieu de nodemon
    command: npm start
    env_file: .env
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - ./mf-back:/usr/src/app
      - api-node-modules:/usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      # SECURITÉ: Bind sur localhost uniquement
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "prisma" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  journey-web:
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  api-node-modules:
  postgres-data:
  web-node-modules:
