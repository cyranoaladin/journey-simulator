version: "3.9"

services:
  api:
    build:
      context: ./mf-back
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/journey
      ADMIN_API_KEY: change-me
    ports:
      - "3000:3000"
    volumes:
      - ./mf-back:/usr/src/app
      - api-node-modules:/usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prisma"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  journey-web:
    build:
      context: ./journey-simulator/web
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: postgresql://prisma:prisma@postgres:5432/prisma?schema=public
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      SOLANA_RPC_URL: https://api.devnet.solana.com
    ports:
      - "3001:3000"
    volumes:
      - ./journey-simulator/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mongo-data:
  api-node-modules:
  postgres-data:
  web-node-modules:
