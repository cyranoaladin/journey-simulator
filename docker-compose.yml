version: "3.9"

services:
  api:
    build:
      context: ./mf-back
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    command: npm run dev
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/journey
      ADMIN_API_KEY: change-me
      RAG_COLLECTION: web3_expert_knowledge
      RAG_SEARCH_URL: http://172.18.0.4:8001/kb/search
      RAG_INGEST_URL: http://172.18.0.4:8001/kb/ingest
      RAG_API_KEY: MoneyFactory_2025_Secure_Token_X9
      OPENAI_API_KEY: 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
      LLM_MODEL_NAME: gpt-4.1-mini-2025-04-14
      JWT_SECRET: une_phrase_secrete_super_longue_et_complexe
    ports:
      - "3002:3000"
    volumes:
      - ./mf-back:/usr/src/app
      - api-node-modules:/usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:6
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "prisma" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  journey-web:
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:3002
    ports:
      - "3003:80"
    depends_on:
      - api

volumes:
  mongo-data:
  api-node-modules:
  postgres-data:
  web-node-modules:
