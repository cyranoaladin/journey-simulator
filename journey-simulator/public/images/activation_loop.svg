  </g>
  <g transform="translate(500, 100)">
    <circle r="40" fill="#1E1E3F" stroke="#FF00FF" stroke-width="3" />
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">GOVERN</text>
  </g>
  <g transform="translate(700, 100)">
    <circle r="40" fill="#1E1E3F" stroke="#00FF00" stroke-width="3" />
    <text x="0" y="5" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">LAUNCH</text>
