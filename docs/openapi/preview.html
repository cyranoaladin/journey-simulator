<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Journey Simulator API — OpenAPI</title>
    <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script>
    <style>
      body { margin: 0; }
      rapi-doc { --primary-color: #14f195; --nav-accent-color: #9945ff; }
    </style>
  </head>
  <body>
    <rapi-doc 
      spec-url="./journey-simulator.yaml"
      render-style="read"
      show-header="true"
      allow-spec-url-load="false"
      allow-spec-file-load="false"
      theme="light"
      regular-font="Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial"
    >
      <div slot="logo">Journey Simulator API</div>
    </rapi-doc>
  </body>
</html>
