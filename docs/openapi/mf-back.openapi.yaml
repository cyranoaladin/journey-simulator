openapi: 3.1.0
info:
  title: Money Factory AI Backend API
  version: 1.0.0
  description: Core backend services for Agents, Journeys, and Auth.
servers:
  - url: http://localhost:3000/api
    description: Local Development
paths:
  /user/wallet-challenge:
    post:
      summary: Get a nonce for wallet authentication
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [wallet_address]
              properties:
                wallet_address:
                  type: string
      responses:
        '200':
          description: Challenge generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  nonce: { type: string }
        '404':
          description: User not found

  /user/login-wallet:
    post:
      summary: Login with wallet address (and optional signature)
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [wallet_address]
              properties:
                wallet_address: { type: string }
                message: { type: string }
                signature: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid signature or challenge expired

  /user/profile:
    get:
      summary: Get current user profile
      tags: [User]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  user: { $ref: '#/components/schemas/User' }

  /journey/user-progress:
    get:
      summary: Get user journey progress
      tags: [Journey]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Progress data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  progress: { $ref: '#/components/schemas/UserProgress' }

  "/api/journeys/metrics":
    get:
      summary: "Get global journey metrics"
      description: "Returns aggregated metrics for all journeys"
      responses:
        "200":
          description: "Global metrics"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/GlobalMetrics"
  "/api/journeys/{id}/metrics":
    parameters:
      - name: "id"
        in: "path"
        required: true
        schema:
          type: "string"
    get:
      summary: "Get specific journey metrics"
      description: "Returns metrics for a single journey"
      responses:
        "200":
          description: "Journey metrics"
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/JourneyMetrics"

  /agents/runs:
    get:
      summary: List agent runs
      tags: [Agents]
      security:
        - bearerAuth: []
      parameters:
        - name: journeyId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AgentRun' }

  /health:
    get:
      summary: Health check
      tags: [System]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: 'ok' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        wallet_address: { type: string }
        role: { type: string, enum: [user, admin] }
        persona: { type: string }
    
    LoginResponse:
      type: object
      properties:
        success: { type: boolean }
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        refreshToken: { type: string }

    UserProgress:
      type: object
      properties:
        total_xp: { type: number }
        completed_phases: { type: number }
        nft_certificates: { type: array, items: { type: object } }
        token_transactions: { type: object }

    AgentRun:
      type: object
      properties:
        _id:
          type: string
        agentName:
          type: string
        status:
          type: string
          enum: [started, succeeded, failed]
        createdAt:
          type: string
          format: date-time
        output:
          type: object
          description: "Agent output data"

    GlobalMetrics:
      type: object
      properties:
        totalJourneys:
          type: integer
        completedJourneys:
          type: integer
        journeysByState:
          type: object
          additionalProperties:
            type: integer
        globalCompletionAvg:
          type: number
        agentRuns:
          type: object
          properties:
            total:
              type: integer
            avgDurationMs:
              type: integer
            successRate:
              type: number

    JourneyMetrics:
      type: object
      properties:
        journeyId:
          type: string
        state:
          type: string
        currentStepId:
          type: string
        completionPercentage:
          type: number
        agentRuns:
          type: object
          properties:
            count:
              type: integer
            avgDurationMs:
              type: integer
