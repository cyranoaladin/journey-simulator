openapi: 3.0.3
info:
  title: Journey Web API
  version: 0.2.0
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  time:
                    type: string
  /api/ai/echo:
    post:
      summary: Echo sample
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  upper: { type: string }
                  length: { type: integer }
                  tags:
                    type: array
                    items: { type: string }
        '400':
          description: Bad Request
  /api/tx/prepare:
    post:
      summary: Prepare a Solana transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum: [transfer]
                params:
                  type: object
                  properties:
                    payer: { type: string }
                    to: { type: string }
                    lamports: { type: integer }
      responses:
        '200':
          description: Prepared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  tx: { type: string }
        '400':
          description: Bad request
        '500':
          description: Server misconfiguration
