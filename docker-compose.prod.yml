version: '3.8'

services:
  # --- Neural Core (API) ---
  api:
    build:
      context: ./mf-back
      dockerfile: Dockerfile
    container_name: mfai_neural_core
    restart: always
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/journey
      - PORT=3002
    env_file:
      - ./mf-back/.env
    ports:
      - "3002:3002"
    volumes:
      - ./mf-back:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - mfai_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Memory Persistence ---
  mongo:
    image: mongo:6.0
    container_name: mfai_memory_bank
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mfai_data:/data/db
    networks:
      - mfai_net
    deploy:
      resources:
        limits:
          memory: 1G

  # --- Holo-Interface (Frontend) ---
  journey-web:
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    container_name: mfai_holo_interface
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3002
    networks:
      - mfai_net

networks:
  mfai_net:
    driver: bridge

volumes:
  mfai_data:
