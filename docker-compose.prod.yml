version: '3.8'

services:
  # --- Neural Core (API) ---
  api:
    build:
      context: ./mf-back
      dockerfile: Dockerfile
    container_name: mfai_neural_core
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://mfai:mfai_secure_2024@postgres:5432/mfai_db?schema=public
      - PORT=3002
    env_file:
      - ./mf-back/.env
    ports:
      - "3002:3002"
    volumes:
      - ./mf-back:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    networks:
      - mfai_net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3002/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- PostgreSQL Database (Unified Stack) ---
  postgres:
    image: postgres:16-alpine
    container_name: mfai_postgres
    restart: always
    environment:
      POSTGRES_USER: mfai
      POSTGRES_PASSWORD: mfai_secure_2024
      POSTGRES_DB: mfai_db
    ports:
      - "5433:5432"
    volumes:
      - mfai_postgres_data:/var/lib/postgresql/data
    networks:
      - mfai_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfai -d mfai_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # --- Holo-Interface (Frontend) ---
  journey-web:
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    container_name: mfai_holo_interface
    restart: always
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3002
      - DATABASE_URL=postgresql://mfai:mfai_secure_2024@postgres:5432/mfai_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mfai_net

networks:
  mfai_net:
    driver: bridge

volumes:
  mfai_postgres_data:
