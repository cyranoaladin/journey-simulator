version: "3.9"

services:
  mfai-api:
    container_name: mfai-api
    build:
      context: ./mf-back
      dockerfile: Dockerfile
    command: npm start
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGO_URI: mongodb://mfai-mongo:27017/journey
    env_file:
      - .env
    ports:
      - "3002:3002"
    depends_on:
      mfai-mongo:
        condition: service_healthy
    restart: always
    networks:
      - mfai-network

  mfai-mongo:
    container_name: mfai-mongo
    image: mongo:6
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mfai-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mfai-network

  mfai-postgres:
    container_name: mfai-postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mfai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "prisma"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mfai-network

  mfai-web:
    container_name: mfai-web
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: https://journey.mfai.app/api
      VITE_RESOURCE_LIBRARY_BASE_URL: /documents
      API_UPSTREAM: mfai-api:3002
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - mfai-api
    restart: always
    networks:
      - mfai-network

volumes:
  mfai-mongo-data:
  mfai-postgres-data:

networks:
  mfai-network:
    driver: bridge
