sonar.projectKey=MFAI-Monorepo
sonar.projectName=Money Factory AI
sonar.projectVersion=1.0

# Chemins des sources
sonar.sources=journey-simulator/src,mf-back,web

# Exclusions Globales (Ignore tout ce qui commence par 'data')
