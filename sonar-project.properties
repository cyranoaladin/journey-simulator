# Exclusions spécifiques au moteur JavaScript/TypeScript
sonar.javascript.exclusions=data/**,**/node_modules/**
sonar.typescript.exclusions=data/**,**/node_modules/**

# Encodage
sonar.sourceEncoding=UTF-8
