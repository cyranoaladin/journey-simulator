# actionlint: allow-secrets SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT DOCKER_REGISTRY DOCKER_USERNAME DOCKER_PASSWORD DOCKER_IMAGE DATABASE_URL HEALTHCHECK_BASE_URL ADMIN_API_KEY
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ../journey-simulator

      - name: Build Storybook bundle
        run: npm run build-storybook
        working-directory: ../journey-simulator

      - name: Install Playwright Browsers (journey-simulator)
        run: npx playwright install --with-deps
        working-directory: ../journey-simulator

      - name: Run E2E tests (journey-simulator)
        run: npm run test:e2e
        working-directory: ../journey-simulator

      - name: Upload coverage artifact (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: web/coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload Playwright test-results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results
          if-no-files-found: ignore

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      - name: Upload Storybook bundle (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: journey-simulator/storybook-static
          if-no-files-found: ignore

      - name: Upload Playwright report (journey-simulator, always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-journey-simulator
          path: journey-simulator/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test-results (journey-simulator, always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-journey-simulator
          path: journey-simulator/test-results
          if-no-files-found: ignore

      # actionlint: allow-secrets SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT
      - name: Detect Sentry configuration
        id: sentry_config
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets['SENTRY_AUTH_TOKEN'] }}
          SENTRY_ORG: ${{ secrets['SENTRY_ORG'] }}
          SENTRY_PROJECT: ${{ secrets['SENTRY_PROJECT'] }}
        run: |
          if [ -n "${SENTRY_AUTH_TOKEN}" ] && [ -n "${SENTRY_ORG}" ] && [ -n "${SENTRY_PROJECT}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # actionlint: allow-secrets SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT
      - name: Create Sentry release + upload sourcemaps (optional)
        if: ${{ steps.sentry_config.outputs.enabled == 'true' }}
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets['SENTRY_AUTH_TOKEN'] }}
          SENTRY_ORG: ${{ secrets['SENTRY_ORG'] }}
          SENTRY_PROJECT: ${{ secrets['SENTRY_PROJECT'] }}
        with:
          environment: production
          version: ${{ github.ref_name }}
          projects: ${{ secrets['SENTRY_PROJECT'] }}
          sourcemaps: './web/.next'

      # actionlint: allow-secrets DOCKER_REGISTRY DOCKER_USERNAME DOCKER_PASSWORD DOCKER_IMAGE
      - name: Detect Docker configuration
        id: docker_config
        env:
          DOCKER_REGISTRY: ${{ secrets['DOCKER_REGISTRY'] }}
          DOCKER_USERNAME: ${{ secrets['DOCKER_USERNAME'] }}
          DOCKER_PASSWORD: ${{ secrets['DOCKER_PASSWORD'] }}
          DOCKER_IMAGE: ${{ secrets['DOCKER_IMAGE'] }}
        run: |
          if [ -n "${DOCKER_REGISTRY}" ] && [ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_PASSWORD}" ] && [ -n "${DOCKER_IMAGE}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # actionlint: allow-secrets DOCKER_REGISTRY DOCKER_USERNAME DOCKER_PASSWORD
      - name: Log in to Docker registry (optional)
        if: ${{ steps.docker_config.outputs.enabled == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets['DOCKER_REGISTRY'] }}
          username: ${{ secrets['DOCKER_USERNAME'] }}
          password: ${{ secrets['DOCKER_PASSWORD'] }}

      # actionlint: allow-secrets DOCKER_REGISTRY DOCKER_IMAGE
      - name: Build and push Docker image (optional)
        if: ${{ steps.docker_config.outputs.enabled == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ secrets['DOCKER_REGISTRY'] }}/${{ secrets['DOCKER_IMAGE'] }}:${{ github.ref_name }}

  deploy-migrate:
    runs-on: ubuntu-latest
    needs: release
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@11
      - run: npm ci
      # actionlint: allow-secrets DATABASE_URL
      - name: Run Prisma migrate deploy (prod)
        if: ${{ secrets['DATABASE_URL'] != '' }}
        env:
          DATABASE_URL: ${{ secrets['DATABASE_URL'] }}
        run: npm run migrate:deploy

  post-deploy-health:
    runs-on: ubuntu-latest
    needs: deploy-migrate
    steps:
      # actionlint: allow-secrets HEALTHCHECK_BASE_URL
      - name: Check /api/healthz
        if: ${{ secrets['HEALTHCHECK_BASE_URL'] != '' }}
        env:
          HEALTHCHECK_BASE_URL: ${{ secrets['HEALTHCHECK_BASE_URL'] }}
        run: |
          set -euo pipefail
          echo "Checking $HEALTHCHECK_BASE_URL/api/healthz"
          body=$(curl -fsSL "$HEALTHCHECK_BASE_URL/api/healthz")
          echo "$body"
          echo "$body" | grep -q '"ok"' || (echo "healthz missing ok" && exit 1)
      # actionlint: allow-secrets HEALTHCHECK_BASE_URL ADMIN_API_KEY
      - name: Smoke test /admin/state (x-api-key)
        if: ${{ secrets['HEALTHCHECK_BASE_URL'] != '' && secrets['ADMIN_API_KEY'] != '' }}
        env:
          HEALTHCHECK_BASE_URL: ${{ secrets['HEALTHCHECK_BASE_URL'] }}
          ADMIN_API_KEY: ${{ secrets['ADMIN_API_KEY'] }}
        run: |
          set -euo pipefail
          echo "Checking $HEALTHCHECK_BASE_URL/admin/state"
          html=$(curl -fsSL -H "x-api-key: $ADMIN_API_KEY" "$HEALTHCHECK_BASE_URL/admin/state")
          echo "$html" | head -c 5000
          echo "$html" | grep -qi 'JourneyState' || (echo "admin state did not render" && exit 1)
