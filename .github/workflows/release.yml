name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests
        run: npm run test:e2e

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ../journey-simulator

      - name: Build Storybook bundle
        run: npm run build-storybook
        working-directory: ../journey-simulator

      - name: Install Playwright Browsers (journey-simulator)
        run: npx playwright install --with-deps
        working-directory: ../journey-simulator

      - name: Setup test database
        env:
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db?schema=public"
        run: |
          npx prisma migrate deploy || npx prisma db push --skip-generate
        working-directory: ./

      - name: Start backend server for frontend E2E tests
        env:
          DEMO_MODE: "true"
          NEXT_PUBLIC_TEST_MODE: "1"
          DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db?schema=public"
          KILL_SWITCH: "1"
        run: |
          # Start backend in demo mode (background)
          npm run dev > /tmp/backend.log 2>&1 &
          echo $! > /tmp/web-server.pid
          # Wait for server to be ready (max 60s)
          timeout 60 bash -c 'until curl -f http://localhost:3001/api/healthz 2>/dev/null; do sleep 2; echo "Waiting for backend..."; done' || {
            echo "Backend failed to start. Log tail:"
            tail -50 /tmp/backend.log
            exit 1
          }
          echo "Backend is ready"
        working-directory: ./

      - name: Run E2E tests (journey-simulator)
        run: npm run test:e2e
        working-directory: ../journey-simulator

      - name: Stop backend server
        if: always()
        run: |
          if [ -f /tmp/web-server.pid ]; then
            kill $(cat /tmp/web-server.pid) || true
            rm /tmp/web-server.pid
          fi
          # Show backend logs on failure
          if [ -f /tmp/backend.log ]; then
            echo "=== Backend logs (last 100 lines) ==="
            tail -100 /tmp/backend.log
          fi

      - name: Upload coverage artifact (lcov)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: web/coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload Playwright test-results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results
          if-no-files-found: ignore

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

      - name: Upload Storybook bundle (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: journey-simulator/storybook-static
          if-no-files-found: ignore

      - name: Upload Playwright report (journey-simulator, always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-journey-simulator
          path: journey-simulator/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test-results (journey-simulator, always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-journey-simulator
          path: journey-simulator/test-results
          if-no-files-found: ignore

      - name: Create Sentry release + upload sourcemaps (optional)
        if: vars.ENABLE_SENTRY_RELEASE == 'true'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ github.ref_name }}
          projects: ${{ secrets.SENTRY_PROJECT }}
          sourcemaps: './web/.next'

      - name: Log in to Docker registry (optional)
        if: vars.ENABLE_DOCKER_BUILD == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image (optional)
        if: vars.ENABLE_DOCKER_BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_IMAGE }}:${{ github.ref_name }}

  deploy-migrate:
    runs-on: ubuntu-latest
    needs: release
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Run Prisma migrate deploy (prod)
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run migrate:deploy

  post-deploy-health:
    runs-on: ubuntu-latest
    needs: deploy-migrate
    env:
      HEALTHCHECK_BASE_URL: ${{ secrets.HEALTHCHECK_BASE_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
    steps:
      - name: Check /api/healthz
        if: ${{ env.HEALTHCHECK_BASE_URL != '' }}
        run: |
          set -euo pipefail
          echo "Checking $HEALTHCHECK_BASE_URL/api/healthz"
          body=$(curl -fsSL "$HEALTHCHECK_BASE_URL/api/healthz")
          echo "$body"
          echo "$body" | grep -q '"ok"' || (echo "healthz missing ok" && exit 1)
      - name: Smoke test /admin/state (x-api-key)
        if: ${{ env.HEALTHCHECK_BASE_URL != '' && env.ADMIN_API_KEY != '' }}
        run: |
          set -euo pipefail
          echo "Checking $HEALTHCHECK_BASE_URL/admin/state"
          html=$(curl -fsSL -H "x-api-key: $ADMIN_API_KEY" "$HEALTHCHECK_BASE_URL/admin/state")
          echo "$html" | head -c 5000
          echo "$html" | grep -qi 'JourneyState' || (echo "admin state did not render" && exit 1)
