name: Backend Tests

on:
  push:
    paths:
      - 'mf-back/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mf-back/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install backend dependencies
        working-directory: mf-back
        run: npm ci

      - name: Run backend test suite
        working-directory: mf-back
        run: npm test
