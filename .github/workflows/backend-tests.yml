name: Backend Tests

on:
  push:
    paths:
      - 'mf-back/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mf-back/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install backend dependencies
        working-directory: mf-back
        run: npm ci

      - name: Wait for MongoDB to be ready
        run: |
          # Wait for MongoDB port to be open
          timeout 30 bash -c 'until nc -z localhost 27017 2>/dev/null; do echo "Waiting for MongoDB..."; sleep 1; done' || true
          sleep 3  # Give MongoDB a moment to fully initialize

      - name: Run backend test suite
        working-directory: mf-back
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017
          # Keep SKIP_DB_CONNECTION for tests that don't need DB, but s2_* tests will connect anyway
