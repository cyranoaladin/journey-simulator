name: Test Agents

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./mf-back
    
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: mf-back/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Unit Tests
      run: npm test
      env:
        CI: true

    - name: Check RAG Connection (Optional)
      run: |
        if [ -n "$RAG_TOKEN" ]; then
          node scripts/check-rag-connection.js
        else
          echo "RAG_TOKEN not set, skipping."
        fi
      env:
        RAG_TOKEN: ${{ secrets.RAG_TOKEN }}
