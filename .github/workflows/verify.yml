name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mf-back
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mf-back/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        env:
          SKIP_DB_CONNECTION: "true"
        run: npm test

  frontend:
    name: Frontend lint & unit tests
    runs-on: ubuntu-latest
    needs:
      - backend
    defaults:
      run:
        working-directory: journey-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journey-simulator/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint & unit tests
        run: npm run check
      - name: Build
        run: npm run build

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs:
      - frontend
    defaults:
      run:
        working-directory: journey-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journey-simulator/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        env:
          CI: 'true'
        run: npm run test:e2e:smoke
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            journey-simulator/tests/e2e-report
            journey-simulator/test-results
          if-no-files-found: ignore
