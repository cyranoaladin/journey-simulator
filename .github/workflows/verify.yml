name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: mf-back
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mf-back/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Push Database Schema
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
        run: npx prisma db push --accept-data-loss
      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
        run: npm test

  frontend:
    name: Frontend lint & unit tests
    runs-on: ubuntu-latest
    needs:
      - backend
    defaults:
      run:
        working-directory: journey-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journey-simulator/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Lint & unit tests
        run: npm run check
      - name: Build
        run: npm run build

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs:
      - frontend
    defaults:
      run:
        working-directory: journey-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journey-simulator/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        env:
          CI: 'true'
        run: npm run test:e2e:smoke
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            journey-simulator/tests/e2e-report
            journey-simulator/test-results
          if-no-files-found: ignore
