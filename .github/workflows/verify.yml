name: Verify

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    defaults:
      run:
        working-directory: mf-back
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mf-back/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Push Database Schema
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
        run: npx prisma db push --accept-data-loss
      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
        run: npm test

  frontend:
    name: Frontend lint & unit tests
    runs-on: ubuntu-latest
    needs:
      - backend
    defaults:
      run:
        working-directory: journey-simulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journey-simulator/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci
      - name: Lint & unit tests
        run: npm run check
      - name: Build
        run: npm run build

  playwright-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs:
      - frontend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: journey-simulator/package-lock.json
      - name: Upgrade npm
        run: npm install -g npm@11
      
      - name: Install backend dependencies
        working-directory: mf-back
        run: npm ci
      - name: Generate Prisma Client
        working-directory: mf-back
        run: npx prisma generate
      - name: Push Database Schema
        working-directory: mf-back
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
        run: npx prisma db push --accept-data-loss
      
      - name: Build backend
        working-directory: mf-back
        run: npm run build
      
      - name: Start backend server
        working-directory: mf-back
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
          PORT: 3002
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-key-for-ci
        run: |
          echo "Starting backend server..."
          echo "DATABASE_URL is set: ${DATABASE_URL:0:30}..."
          npm start > ../backend.log 2>&1 &
          BACKEND_PID=$!
          echo $BACKEND_PID > backend.pid
          echo "Backend started with PID: $BACKEND_PID"
          sleep 3
          if ! ps -p $BACKEND_PID > /dev/null; then
            echo "ERROR: Backend process died immediately!"
            cat ../backend.log
            exit 1
          fi
      
      - name: Wait for backend
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:3002/health 2>/dev/null || curl -f http://127.0.0.1:3002/ 2>/dev/null; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Backend not ready yet..."
            sleep 2
          done
          echo "ERROR: Backend failed to start within 60 seconds"
          echo ""
          echo "=== Backend Logs ==="
          cat backend.log || echo "No backend log found"
          echo ""
          echo "=== Backend Process Status ==="
          if [ -f journey-simulator/mf-back/backend.pid ]; then
            BACKEND_PID=$(cat journey-simulator/mf-back/backend.pid)
            echo "Backend PID was: $BACKEND_PID"
            ps aux | grep $BACKEND_PID || echo "Process $BACKEND_PID not found"
          fi
          echo ""
          echo "=== All Node Processes ==="
          ps aux | grep node || echo "No node processes"
          exit 1
      
      - name: Install frontend dependencies
        working-directory: journey-simulator
        run: npm ci
      - name: Build frontend
        working-directory: journey-simulator
        run: npm run build
      - name: Start frontend server
        working-directory: journey-simulator
        run: |
          npm run preview -- --port 3000 --host 0.0.0.0 > frontend.log 2>&1 &
          echo $! > frontend.pid
      - name: Wait for frontend
        working-directory: journey-simulator
        run: |
          echo "Waiting for frontend to be ready..."
          for i in {1..30}; do
            if curl -f http://127.0.0.1:3000/ 2>/dev/null; then
              echo "Frontend is ready!"
              exit 0
            fi
            echo "Attempt $i/30: Frontend not ready yet..."
            sleep 2
          done
          echo "Frontend failed to start within 60 seconds"
          cat frontend.log || true
          exit 1
      - name: Install Playwright browsers
        working-directory: journey-simulator
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
        run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        working-directory: journey-simulator
        env:
          CI: 'true'
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
        run: npm run test:e2e:smoke
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            journey-simulator/tests/e2e-report
            journey-simulator/test-results
          if-no-files-found: ignore
