name: CI (monorepo)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: prisma
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
        ports:
          - 5435:5432
        options: >-
          --health-cmd="pg_isready -U prisma"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            mf-back/package-lock.json
            journey-simulator/package-lock.json
            web/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Init Postgres read-only user (mcp_ro)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client
          export PGPASSWORD=prisma
          psql -h 127.0.0.1 -p 5435 -U prisma -d prisma -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'mcp_ro') THEN
              CREATE ROLE mcp_ro LOGIN PASSWORD 'prisma';
            END IF;
          END $$;
          GRANT CONNECT ON DATABASE prisma TO mcp_ro;
          GRANT USAGE ON SCHEMA public TO mcp_ro;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO mcp_ro;
          GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO mcp_ro;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO mcp_ro;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON SEQUENCES TO mcp_ro;
          SQL

      - name: Install (mf-back)
        working-directory: mf-back
        run: npm ci

      - name: Install (journey-simulator)
        working-directory: journey-simulator
        run: npm ci

      - name: Install (web)
        working-directory: web
        run: npm ci

      - name: Ensure tmp directory exists (MCP filesystem_ro)
        run: mkdir -p tmp

      - name: MCP selftest (filesystem/git/postgres/fetch)
        run: node scripts/mcp-selftest.mjs

      - name: Lint (simulator + web)
        run: npm run lint:all

      - name: Build (simulator + web)
        run: npm run build:all

      - name: Unit tests (back + simulator + web)
        run: npm run test:all

      - name: Install Playwright browsers (journey-simulator)
        working-directory: journey-simulator
        run: npx playwright install --with-deps

      - name: E2E (journey-simulator)
        run: npm run test:e2e:simulator
