name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.project }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: journey-simulator
            working-directory: journey-simulator
            cache-dependency-path: journey-simulator/package-lock.json
            lint-command: npm run lint
            build-command: npm run build
            test-command: npm run test
            e2e-command: npm run test:e2e
            upload-coverage: journey-simulator/coverage
            upload-test-results: journey-simulator/test-results
            upload-report: journey-simulator/tests/e2e-report
            audit-prod: false
            needs-backend: true
          - project: web
            working-directory: web
            cache-dependency-path: web/package-lock.json
            lint-command: npm run lint
            build-command: npm run build
            test-command: npm run test:unit
            e2e-command: npm run test:e2e
            upload-coverage: web/coverage
            upload-test-results: web/test-results
            upload-report: web/playwright-report
            audit-prod: true
            needs-backend: false
    env:
      DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/test_db?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.cache-dependency-path }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.working-directory }}

      - name: Lint
        run: ${{ matrix.lint-command }}
        working-directory: ${{ matrix.working-directory }}

      - name: Build
        run: ${{ matrix.build-command }}
        working-directory: ${{ matrix.working-directory }}

      - name: Run unit tests
        run: ${{ matrix.test-command }}
        working-directory: ${{ matrix.working-directory }}

      - name: Audit prod dependencies
        if: matrix.audit-prod == true
        run: npm audit --omit=dev --audit-level=high || true
        working-directory: ${{ matrix.working-directory }}

      - name: Install backend dependencies (for frontend E2E)
        if: matrix.needs-backend == true
        run: npm ci
        working-directory: web

      - name: Setup test database (for frontend E2E)
        if: matrix.needs-backend == true
        run: npx prisma migrate deploy || npx prisma db push --skip-generate
        working-directory: web

      - name: Start backend server (for frontend E2E)
        if: matrix.needs-backend == true
        env:
          DEMO_MODE: "true"
          NEXT_PUBLIC_TEST_MODE: "1"
          KILL_SWITCH: "1"
        run: |
          npm run dev > /tmp/backend.log 2>&1 &
          echo $! > /tmp/web-server.pid
          timeout 60 bash -c 'until curl -f http://localhost:3001/api/healthz 2>/dev/null; do sleep 2; echo "Waiting for backend..."; done' || {
            echo "Backend failed to start. Log tail:"
            tail -50 /tmp/backend.log
            exit 1
          }
          echo "Backend ready on port 3001"
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: ${{ matrix.working-directory }}

      - name: Run E2E tests
        run: ${{ matrix.e2e-command }}
        working-directory: ${{ matrix.working-directory }}

      - name: Stop backend server
        if: always() && matrix.needs-backend == true
        run: |
          if [ -f /tmp/web-server.pid ]; then
            kill $(cat /tmp/web-server.pid) || true
            rm /tmp/web-server.pid
          fi
          if [ -f /tmp/backend.log ]; then
            echo "=== Backend logs (last 100 lines) ==="
            tail -100 /tmp/backend.log
          fi

      - name: Upload coverage artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.project }}
          path: ${{ matrix.upload-coverage }}
          if-no-files-found: ignore

      - name: Upload Playwright test-results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.project }}
          path: ${{ matrix.upload-test-results }}
          if-no-files-found: ignore

      - name: Upload Playwright report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: ${{ matrix.upload-report }}
          if-no-files-found: ignore
