name: CI (monorepo)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            mf-back/package-lock.json
            journey-simulator/package-lock.json
            web/package-lock.json

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install (mf-back)
        working-directory: mf-back
        run: npm ci

      - name: Install (journey-simulator)
        working-directory: journey-simulator
        run: npm ci

      - name: Install (web)
        working-directory: web
        run: npm ci

      - name: Lint (simulator + web)
        run: npm run lint:all

      - name: Build (simulator + web)
        run: npm run build:all

      - name: Unit tests (back + simulator + web)
        run: npm run test:all

      - name: E2E (journey-simulator)
        run: npm run test:e2e:simulator
