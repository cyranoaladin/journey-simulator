name: CI (monorepo)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            mf-back/package-lock.json
            journey-simulator/package-lock.json
            web/package-lock.json

      - name: Install (mf-back)
        run: npm ci --prefix mf-back

      - name: Install (journey-simulator)
        run: npm ci --prefix journey-simulator

      - name: Install (web)
        run: npm ci --prefix web

      - name: Lint (simulator + web)
        run: npm run lint:all

      - name: Build (simulator + web)
        run: npm run build:all

      - name: Unit tests (back + simulator + web)
        run: npm run test:all

      - name: E2E (journey-simulator)
        run: npm run test:e2e:simulator
