version: "3.9"

services:
  mfai-api:
    container_name: mfai-api
    build:
      context: ./mf-back
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "false"
    command: npm start
    environment:
      NODE_ENV: production
      PORT: 3002
      EXECUTION_ENABLED: "true"
      MONGO_URI: mongodb://mfai-mongo:27017/journey
      API_BASE_URL: https://journey.mfai.app/api
      SKIP_NPM_INSTALL: "true"
    env_file:
      - .deploy.env
    ports:
      - "3002:3002"
    # volumes:
    #   - ./mf-back:/usr/src/app
    #   - /usr/src/app/node_modules
    security_opt:
      - no-new-privileges:true
    # Bind mount for code means writable FS required during deploy. // nosemgrep
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mfai-mongo:
        condition: service_healthy
    restart: always
    networks:
      - mfai-net

  mfai-mongo:
    container_name: mfai-mongo
    image: mongo:6
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mfai-mongo-data:/data/db
    security_opt:
      - no-new-privileges:true
    # Mongo data directory must remain writable. // nosemgrep
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mfai-net

  mfai-postgres:
    container_name: mfai-postgres
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: prisma
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    ports:
      - "5435:5432"
    volumes:
      - mfai-postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    # Postgres data directory must remain writable. // nosemgrep
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "prisma" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mfai-net

  mfai-web:
    container_name: mfai-web
    build:
      context: ./journey-simulator
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: https://journey.mfai.app/api
      VITE_RESOURCE_LIBRARY_BASE_URL: /documents
    ports:
      - "3003:80"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      - mfai-api
    restart: always
    networks:
      - mfai-net

  mfai-redis:
    container_name: mfai-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - mfai-redis-data:/data
    restart: always
    networks:
      - mfai-net

  mfai-web-api:
    container_name: mfai-web-api
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://prisma:prisma@mfai-postgres:5432/prisma?schema=public
      REDIS_URL: redis://mfai-redis:6379
      ADMIN_API_KEY: change-me-dev-only
      SIMULATOR_BASE_URL: http://mfai-web/
      ORIGINS: http://mfai-web,http://localhost:3003
    ports:
      - "3001:3000"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mfai-postgres:
        condition: service_healthy
      mfai-redis:
        condition: service_started
    restart: always
    networks:
      - mfai-net

volumes:
  mfai-mongo-data:
  mfai-postgres-data:
  mfai-redis-data:

networks:
  mfai-net:
    driver: bridge
